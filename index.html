<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHYTUS - Interactive System Prototype</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for a clean look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        #net, .mango-container {
            /* Smooth transitions for all animations */
            transition: all 1.5s ease-in-out;
        }
        #net {
            transform-origin: bottom center;
        }
        .mango-container {
            /* This transition is specifically for the falling animation */
            transition: top 1s ease-in, left 1s ease-in-out, opacity 0.5s;
        }
        .mango {
            width: 20px;
            height: 25px;
            background-color: #FFBF00; /* Mango color */
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            transform: rotate(-15deg);
            position: relative;
        }
        .stem {
            width: 3px;
            height: 8px;
            background-color: #4d2d0b;
            border-radius: 2px;
            position: absolute;
            top: -3px;
            left: 8px;
        }
        @keyframes blink {
            50% { opacity: 0.2; }
        }
        .blinking-dot {
            animation: blink 1.5s infinite;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto bg-white rounded-2xl shadow-lg p-4 md:p-8">
        
        <!-- Header Section -->
        <header class="flex justify-between items-center border-b pb-4 mb-6">
            <h1 class="text-xl md:text-3xl font-bold text-gray-800">PHYTUS System Animation Prototype</h1>
            <div class="text-right">
                <p class="text-sm text-gray-500">System Time</p>
                <p id="system-time" class="text-md md:text-lg font-semibold text-gray-700">--:--:--</p>
            </div>
        </header>

        <!-- Animation Controls Section -->
        <section class="bg-gray-50 p-6 rounded-xl border">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg md:text-2xl font-semibold text-gray-700">Animation Controls</h2>
                <span id="system-status-badge" class="px-3 py-1 text-sm font-medium rounded-full bg-gray-200 text-gray-600">Idle</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
                <div class="flex space-x-2">
                    <button id="start-btn" class="w-full bg-teal-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-teal-700 transition">Start Simulation</button>
                    <button id="pause-btn" class="w-full bg-gray-200 text-gray-700 font-bold py-3 px-4 rounded-lg hover:bg-gray-300 transition" disabled>Pause</button>
                    <button id="reset-btn" class="w-full bg-gray-200 text-gray-700 font-bold py-3 px-4 rounded-lg hover:bg-gray-300 transition" disabled>Reset</button>
                </div>
                
                <div class="col-span-1 md:col-span-2">
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="progress-bar" class="bg-teal-500 h-2.5 rounded-full" style="width: 0%"></div>
                    </div>
                    <div class="flex justify-between text-xs text-gray-500 mt-1">
                        <span>0.0s</span>
                        <span id="progress-time">0.0s / 12.0s</span>
                        <span>12.0s</span>
                    </div>
                </div>
            </div>

            <div class="mt-4">
                <label for="fault-phase" class="block text-sm font-medium text-gray-700">Select Storm Event:</label>
                <select id="fault-phase" class="mt-1 block w-full md:w-1/3 p-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-teal-500 focus:border-teal-500">
                    <option value="wind">High Wind (>25 km/h)</option>
                    <option value="rain">Heavy Rain (>5 mm/h)</option>
                </select>
            </div>
        </section>

        <!-- System Animation View Section -->
        <section class="mt-8">
            <div class="flex justify-between items-center mb-4">
                 <h2 class="text-lg md:text-2xl font-semibold text-gray-700">System Animation View</h2>
                 <span id="operation-status" class="px-3 py-1 font-semibold rounded-full bg-green-100 text-green-800">Normal Operation</span>
            </div>

            <div class="relative w-full h-96 bg-sky-100 rounded-xl p-8 overflow-hidden border-2 border-gray-200">
                <!-- Sky and Ground -->
                <div class="absolute bottom-0 left-0 w-full h-1/3 bg-green-200 z-0"></div>

                <!-- Tree -->
                <div class="absolute bottom-[33.33%] left-1/2 -translate-x-1/2 w-4 h-24 bg-yellow-900 rounded-t-md z-10"></div>
                <div id="tree-canopy" class="absolute bottom-[ calc(33.33% + 96px) ] left-1/2 -translate-x-1/2 w-40 h-40 bg-green-600 rounded-full z-20">
                    <!-- Mangoes in the tree -->
                    <div id="mango1" class="mango-container absolute z-30" style="top: 20%; left: 30%;">
                        <div class="mango"></div><div class="stem"></div>
                    </div>
                    <div id="mango2" class="mango-container absolute z-30" style="top: 50%; left: 60%;">
                        <div class="mango"></div><div class="stem"></div>
                    </div>
                     <div id="mango3" class="mango-container absolute z-30" style="top: 35%; left: 75%;">
                        <div class="mango"></div><div class="stem"></div>
                    </div>
                </div>

                <!-- Sensor Pole -->
                <div class="absolute bottom-[33.33%] left-1/4 -translate-x-1/2 w-2 h-32 bg-gray-500 z-10"></div>
                <div class="absolute bottom-[ calc(33.33% + 128px) ] left-1/4 -translate-x-1/2 p-2 bg-gray-700 rounded-md shadow-lg z-20">
                    <p class="text-white text-xs font-mono">SENSORS</p>
                </div>

                <!-- Net System -->
                <div id="net" class="absolute left-1/2 -translate-x-1/2 bg-gray-400 bg-opacity-60 z-40" style="bottom: 10%; width: 80px; height: 8px; border-radius: 4px;"></div>

                <!-- SMS Alert -->
                <div id="sms-alert" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white p-4 rounded-lg shadow-2xl z-50 flex items-center space-x-3 transition-all opacity-0 scale-90">
                    <svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                    <div>
                        <p class="font-bold text-gray-800">SMS to Farmer</p>
                        <p class="text-sm text-gray-600">Net deployed. Fruits are being collected safely.</p>
                    </div>
                </div>

                <!-- Status Boxes -->
                <div class="absolute top-4 left-4 bg-white/70 backdrop-blur-sm p-3 rounded-lg shadow-md z-50">
                    <h3 class="font-semibold text-gray-800">Wind Sensor</h3><p id="wind-status" class="text-gray-600 flex items-center"><span class="w-2 h-2 rounded-full bg-green-500 mr-2"></span>Normal</p>
                </div>
                 <div class="absolute top-4 right-4 bg-white/70 backdrop-blur-sm p-3 rounded-lg shadow-md z-50">
                    <h3 class="font-semibold text-gray-800">Rain Sensor</h3><p id="rain-status" class="text-gray-600 flex items-center"><span class="w-2 h-2 rounded-full bg-green-500 mr-2"></span>Normal</p>
                </div>
                 <div class="absolute bottom-4 left-4 bg-white/70 backdrop-blur-sm p-3 rounded-lg shadow-md z-50">
                    <h3 class="font-semibold text-gray-800">System Logic</h3><p id="logic-status" class="text-gray-600 flex items-center"><span class="w-2 h-2 rounded-full bg-blue-500 mr-2 blinking-dot"></span>Monitoring...</p>
                </div>
            </div>
        </section>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const resetBtn = document.getElementById('reset-btn');
        const faultPhaseSelect = document.getElementById('fault-phase');
        const progressBar = document.getElementById('progress-bar');
        const progressTime = document.getElementById('progress-time');
        const systemStatusBadge = document.getElementById('system-status-badge');
        const operationStatus = document.getElementById('operation-status');
        const windStatus = document.getElementById('wind-status');
        const rainStatus = document.getElementById('rain-status');
        const logicStatus = document.getElementById('logic-status');
        const net = document.getElementById('net');
        const systemTimeDisplay = document.getElementById('system-time');
        const treeCanopy = document.getElementById('tree-canopy');
        const mango1 = document.getElementById('mango1');
        const mango2 = document.getElementById('mango2');
        const mango3 = document.getElementById('mango3');
        const smsAlert = document.getElementById('sms-alert');

        let simulationInterval;
        let progress = 0;
        const totalDuration = 12000;
        let isPaused = false;

        function updateSimulation() {
            if (isPaused) return;

            progress += 100;
            const elapsedSeconds = (progress / 1000).toFixed(1);
            const progressPercent = (progress / totalDuration) * 100;

            progressBar.style.width = `${progressPercent}%`;
            progressTime.textContent = `${elapsedSeconds}s / ${(totalDuration / 1000).toFixed(1)}s`;

            const eventType = faultPhaseSelect.value;
            
            if (elapsedSeconds < 2.0) {
                logicStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-blue-500 mr-2 blinking-dot"></span>Monitoring...`;
            } else if (elapsedSeconds >= 2.0 && elapsedSeconds < 4.0) {
                operationStatus.textContent = 'Storm Detected!';
                operationStatus.className = 'px-3 py-1 font-semibold rounded-full bg-red-100 text-red-800';
                logicStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500 mr-2 blinking-dot"></span>ALERT!`;
                if (eventType === 'wind') windStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500 mr-2 blinking-dot"></span>High Wind!`;
                else rainStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500 mr-2 blinking-dot"></span>Heavy Rain!`;
            } else if (elapsedSeconds >= 4.0 && elapsedSeconds < 8.0) {
                operationStatus.textContent = 'Deploying Net...';
                net.style.bottom = '33.33%';
                net.style.width = '260px'; 
                net.style.height = '100px';
                net.style.borderRadius = '0 0 150px 150px';
            } else if (elapsedSeconds >= 8.0 && elapsedSeconds < 10.0) {
                operationStatus.textContent = 'Net Deployed! Collecting Fruits...';
                
                const mainContainer = document.querySelector('.relative.w-full');
                mainContainer.appendChild(mango1);
                mainContainer.appendChild(mango2);
                mainContainer.appendChild(mango3);

                // *** CORRECTED MANGO FALLING POSITIONS ***
                // These new 'top' and 'left' values ensure the mangoes land inside the net's visual area.
                mango1.style.top = '55%';
                mango1.style.left = '45%';

                mango2.style.top = '52%';
                mango2.style.left = '50%';
                
                mango3.style.top = '58%';
                mango3.style.left = '55%';
            } else if (elapsedSeconds >= 10.0 && elapsedSeconds < 12.0) {
                operationStatus.textContent = 'Fruit Collection Complete';
                logicStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-yellow-500 mr-2"></span>IoT Alert Sent`;
                smsAlert.style.opacity = '1';
                smsAlert.style.transform = 'scale(1) translateX(-50%) translateY(-50%)';
            }

            if (progress >= totalDuration) {
                clearInterval(simulationInterval);
                systemStatusBadge.textContent = 'Finished';
                systemStatusBadge.className = 'px-3 py-1 text-sm font-medium rounded-full bg-blue-200 text-blue-800';
            }
        }

        function startSimulation() {
            if (progress >= totalDuration) return;
            isPaused = false;
            simulationInterval = setInterval(updateSimulation, 100);
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            resetBtn.disabled = false;
            faultPhaseSelect.disabled = true;
            startBtn.classList.add('bg-gray-400', 'cursor-not-allowed');
            pauseBtn.classList.remove('bg-gray-200');
            pauseBtn.classList.add('bg-yellow-500', 'text-white');
            systemStatusBadge.textContent = 'Running';
            systemStatusBadge.className = 'px-3 py-1 text-sm font-medium rounded-full bg-green-200 text-green-800';
        }

        function pauseSimulation() {
            if (isPaused) {
                isPaused = false;
                pauseBtn.textContent = 'Pause';
                startSimulation();
            } else {
                isPaused = true;
                clearInterval(simulationInterval);
                pauseBtn.textContent = 'Resume';
                systemStatusBadge.textContent = 'Paused';
                systemStatusBadge.className = 'px-3 py-1 text-sm font-medium rounded-full bg-yellow-200 text-yellow-800';
            }
        }

        function resetSimulation() {
            clearInterval(simulationInterval);
            isPaused = false;
            progress = 0;
            progressBar.style.width = '0%';
            progressTime.textContent = `0.0s / ${(totalDuration / 1000).toFixed(1)}s`;
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            resetBtn.disabled = true;
            faultPhaseSelect.disabled = false;
            pauseBtn.textContent = 'Pause';
            startBtn.classList.remove('bg-gray-400', 'cursor-not-allowed');
            pauseBtn.classList.remove('bg-yellow-500', 'text-white');
            pauseBtn.classList.add('bg-gray-200');
            systemStatusBadge.textContent = 'Idle';
            systemStatusBadge.className = 'px-3 py-1 text-sm font-medium rounded-full bg-gray-200 text-gray-600';
            operationStatus.textContent = 'Normal Operation';
            operationStatus.className = 'px-3 py-1 font-semibold rounded-full bg-green-100 text-green-800';
            windStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-green-500 mr-2"></span>Normal`;
            rainStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-green-500 mr-2"></span>Normal`;
            logicStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-blue-500 mr-2 blinking-dot"></span>Monitoring...`;
            
            net.style.bottom = '10%';
            net.style.width = '80px';
            net.style.height = '8px';
            net.style.borderRadius = '4px';

            treeCanopy.appendChild(mango1);
            treeCanopy.appendChild(mango2);
            treeCanopy.appendChild(mango3);
            mango1.style.top = '20%';
            mango1.style.left = '30%';
            mango2.style.top = '50%';
            mango2.style.left = '60%';
            mango3.style.top = '35%';
            mango3.style.left = '75%';

            smsAlert.style.opacity = '0';
            smsAlert.style.transform = 'scale(0.9) translateX(-50%) translateY(-50%)';
        }
        
        function updateTime() {
            const now = new Date();
            systemTimeDisplay.textContent = now.toLocaleTimeString('en-IN', { hour12: false });
        }

        startBtn.addEventListener('click', startSimulation);
        pauseBtn.addEventListener('click', pauseSimulation);
        resetBtn.addEventListener('click', resetSimulation);
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
